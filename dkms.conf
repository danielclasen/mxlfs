# DKMS configuration for building mxlfs against each installed kernel.
PACKAGE_NAME="mxlfs"
PACKAGE_VERSION="0.1.0" # x-release-please-version
BUILT_MODULE_NAME[0]="mxlfs"
BUILT_MODULE_LOCATION[0]="kernel/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C kernel KDIR=${kernel_source_dir}"
CLEAN="make -C kernel KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL_MIN="6.18"
BUILD_EXCLUSIVE_CONFIG="CONFIG_TRANSPARENT_HUGEPAGE"
