name: release-please

on:
  push:
    branches: [main]
  # Re-runs the pass without waiting for a push, for a release PR that fell
  # out of step with main.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-please

jobs:
  # Every merge to main opens or updates one release PR. Merging it tags
  # vX.Y.Z-rc.N; "prerelease": false in the config is the one change that
  # cuts a stable release.
  #
  # RELEASE_PLEASE_TOKEN, a token that starts workflows, lets CI run on the
  # release PR. Without it the default token opens the PR and cuts the
  # release all the same, and the assets below are built here, in the run
  # that cuts it, so no tag-triggered workflow has to start.
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # The DKMS package for Debian and Ubuntu, built in Debian 13 from the
  # tagged tree, in a job of its own so that a failed package build holds
  # back neither the source tarball nor setcheck. The file name carries
  # the release version: GitHub renames an asset with a "~" in its name,
  # so the package version (0.1.0~rc.7) would not match the name
  # SHA256SUMS lists. A stable release's package already has that name.
  deb:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Debian package
        run: |
          dkms=$(sed -n 's/^PACKAGE_VERSION="\([^"]*\)".*/\1/p' dkms.conf)
          if [ "$dkms" != "$VERSION" ]; then
            echo "dkms.conf has PACKAGE_VERSION $dkms, the release is $VERSION" >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/src" -w /src debian:trixie sh -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential dpkg-dev debhelper dh-dkms >/dev/null &&
            ./dev/deb.sh'
          sudo chown -R "$(id -u):$(id -g)" build
          deb="build/deb/mxlfs-dkms_${VERSION}_all.deb"
          for f in build/deb/mxlfs-dkms_*_all.deb; do
            [ "$f" = "$deb" ] || mv "$f" "$deb"
          done
          (cd build/deb && sha256sum "${deb##*/}" > SHA256SUMS)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$TAG" build/deb/mxlfs-dkms_"${VERSION}"_all.deb build/deb/SHA256SUMS

  # The source tarball is what the talos-pkgs fork builds the module from,
  # pinned by its checksums; setcheck is the image cluster tests run.
  assets:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Source tarball
        run: |
          git archive --format=tar.gz --prefix="mxlfs-${VERSION}/" -o "mxlfs-${VERSION}.tar.gz" "$TAG"
          sha256sum "mxlfs-${VERSION}.tar.gz" > "mxlfs-${VERSION}.tar.gz.sha256"
          sha512sum "mxlfs-${VERSION}.tar.gz" > "mxlfs-${VERSION}.tar.gz.sha512"

      # Other builds pin the tarball by its checksum, so a re-run never
      # replaces it: an attached tarball must be the one built here, and
      # only checksum files a failed upload left out are added.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar="mxlfs-${VERSION}.tar.gz"
          attached=$(gh release view "$TAG" --json assets -q '.assets[].name')
          if ! printf '%s\n' "$attached" | grep -qxF "$tar"; then
            gh release upload "$TAG" "$tar" "$tar.sha256" "$tar.sha512"
            exit 0
          fi
          gh release download "$TAG" -p "$tar" -O attached.tar.gz
          want=$(sha256sum < "$tar")
          have=$(sha256sum < attached.tar.gz)
          if [ "$have" != "$want" ]; then
            echo "::error::$TAG already has a $tar that differs from the one built from $TAG; it is left in place"
            exit 1
          fi
          echo "$tar is attached already and identical"
          for f in "$tar.sha256" "$tar.sha512"; do
            printf '%s\n' "$attached" | grep -qxF "$f" || gh release upload "$TAG" "$f"
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tools/setcheck
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mxlfs-setcheck:${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
