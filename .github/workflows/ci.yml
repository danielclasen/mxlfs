name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A new kernel release can break the build without a change here; the
  # weekly run finds it.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The kernel Talos ships (talos-pkgs Pkgfile linux_version).
  TALOS_KERNEL: 6.18.42

jobs:
  # The newest stable release and, while one is open, the mainline release
  # candidate, from kernel.org.
  kernels:
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.k.outputs.stable }}
      rc: ${{ steps.k.outputs.rc }}
      matrix: ${{ steps.k.outputs.matrix }}
    steps:
      - id: k
        run: |
          curl -fsSL https://www.kernel.org/releases.json > releases.json
          stable=$(jq -r .latest_stable.version releases.json)
          rc=$(jq -r '.releases[] | select(.moniker == "mainline") | .version | select(test("-rc"))' releases.json)
          {
            echo "stable=$stable"
            echo "rc=$rc"
            echo "matrix=$(jq -cn --arg a "$TALOS_KERNEL" --arg b "$stable" '[$a, $b] | unique')"
          } >> "$GITHUB_OUTPUT"
          echo "talos $TALOS_KERNEL, stable $stable, rc ${rc:-none}"

  # checkpatch of the newest stable release, with the exceptions in
  # .checkpatch.conf.
  checkpatch:
    needs: kernels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: checkpatch
        env:
          STABLE: ${{ needs.kernels.outputs.stable }}
        run: |
          tag=v$(echo "$STABLE" | cut -d. -f1,2)
          mkdir -p /tmp/cp
          for f in checkpatch.pl spelling.txt const_structs.checkpatch; do
            curl -fsSL "https://raw.githubusercontent.com/torvalds/linux/$tag/scripts/$f" -o "/tmp/cp/$f"
          done
          perl /tmp/cp/checkpatch.pl --no-tree --terse -f kernel/mxlfs.c kernel/mxlfs_uapi.h
          perl /tmp/cp/checkpatch.pl --no-tree --terse \
            --ignore LINUX_VERSION_CODE,CONSTANT_COMPARISON -f kernel/compat.h

  # The module, the harness and setcheck, built in the development image
  # against the kernel dev/kernel.sh builds for the VM tests, with KASAN
  # and lockdep, so a warning-free compile here is the one those tests run.
  build:
    needs: kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.kernels.outputs.matrix) }}
    env:
      KERNEL_VERSION: ${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@v6

      - name: Development image
        run: docker build -q -t mxlfs-dev dev

      # The kernel tree is about 1.5 GB; a cache hit skips a 10 to 20
      # minute build. The key covers what decides the tree.
      - name: Kernel cache
        uses: actions/cache@v4
        with:
          path: build/linux-${{ matrix.kernel }}
          key: kernel-${{ matrix.kernel }}-${{ hashFiles('dev/kernel.sh', 'dev/kernel-src.sh', 'dev/Dockerfile') }}

      - name: Kernel
        run: ./dev/run.sh env KERNEL_VERSION="$KERNEL_VERSION" ./dev/kernel.sh

      - name: Module
        run: |
          ./dev/run.sh sh -c "make -C kernel KDIR=/src/build/linux-$KERNEL_VERSION W=1 C=1 2>&1 | tee /tmp/module.log;
            ! grep -E 'warning:|error:' /tmp/module.log"

      - name: Harness
        run: ./dev/run.sh make -C tools CFLAGS="-O2 -g -Wall -Wextra -Werror -Wno-format-truncation"

      - name: setcheck
        if: matrix.kernel == env.TALOS_KERNEL
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell
          ./dev/run.sh sh -c 'cd tools/setcheck && test -z "$(gofmt -l .)" && go vet ./... && go test ./... && go build -o /tmp/setcheck .'

      - name: Keep the build for the VM tests
        run: tar -cf build.tar kernel/mxlfs.ko tools/harness

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.kernel }}
          path: build.tar
          retention-days: 3

  # The shell tests in a virtme-ng VM, on each kernel the build job built.
  # The hosted runners expose /dev/kvm, which only the runner user's group
  # may open by default. rdma.sh and libmxl.sh run against dev/libmxl.sh's
  # build of a qvest-digital/mxl checkout, so neither runs here.
  vm-tests:
    needs: [kernels, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.kernels.outputs.matrix) }}
        test:
          - run: FORMAT=video ./tests/redundancy.sh
          - run: FORMAT=data ./tests/redundancy.sh
          - run: FORMAT=audio ./tests/redundancy.sh
          - run: FORMAT=video RATE=60000 RATE_DEN=1001 ./tests/redundancy.sh
          - run: FORMAT=video WIDTH=3840 HEIGHT=2160 ./tests/redundancy.sh
          - run: FORMAT=data RATE=30000 RATE_DEN=1001 ./tests/redundancy.sh
          - run: FORMAT=audio SAMPLE_RATE=96000 CHANNELS=16 ./tests/redundancy.sh
          - run: ./tests/wait.sh
          - run: FORMAT=video ./tests/replace.sh
          - run: FORMAT=data ./tests/replace.sh
          - run: FORMAT=audio ./tests/replace.sh
          - run: ./tests/placeholder.sh
          - run: ./tests/views.sh
          - run: ./tests/huge.sh
          # A guest of two NUMA nodes, each half of dev/vm.sh's default 3G
          # and 4 CPUs: vng needs the nodes' memory to add up to VM_MEMORY.
          - run: ./tests/numa.sh
            vng: --numa 1536M,cpus=0-1 --numa 1536M,cpus=2-3
          - run: ./tests/move.sh
            vng: --numa 1536M,cpus=0-1 --numa 1536M,cpus=2-3
    name: vm-tests (${{ matrix.kernel }}, ${{ matrix.test.run }})
    env:
      KERNEL_VERSION: ${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@v6

      - name: Open /dev/kvm to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Development image
        run: docker build -q -t mxlfs-dev dev

      - name: Kernel cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-${{ matrix.kernel }}
          key: kernel-${{ matrix.kernel }}-${{ hashFiles('dev/kernel.sh', 'dev/kernel-src.sh', 'dev/Dockerfile') }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.kernel }}

      - run: tar -xf build.tar

      - name: ${{ matrix.test.run }}
        env:
          TEST: ${{ matrix.test.run }}
          VNG: ${{ matrix.test.vng }}
        run: ./dev/run.sh env KERNEL_VERSION="$KERNEL_VERSION" VNG_OPTS="$VNG" ./dev/vm.sh "$TEST"

  # The module against the kernel headers distributions ship, as DKMS
  # builds it there.
  distro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04
            setup: apt-get install -y -qq linux-headers-generic
          - name: debian-13-backports
            image: debian:trixie
            setup: >-
              echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list &&
              apt-get update -qq &&
              apt-get install -y -qq -t trixie-backports linux-headers-amd64
    name: distro (${{ matrix.name }})
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Headers
        env:
          DEBIAN_FRONTEND: noninteractive
          SETUP: ${{ matrix.setup }}
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential kmod sparse
          sh -c "$SETUP"
      - name: Module
        run: |
          for kdir in /usr/src/linux-headers-*; do
            [ -f "$kdir/Module.symvers" ] || continue
            echo "== $kdir"
            make -C kernel KDIR="$kdir" clean >/dev/null
            make -C kernel KDIR="$kdir" W=1 C=1 2>&1 | tee /tmp/module.log
            if grep -E 'warning:|error:' /tmp/module.log | grep -v -E 'compiler differs|pahole version differs'; then
              exit 1
            fi
            modinfo -F vermagic kernel/mxlfs.ko
          done

  # The next kernel, while it is a release candidate: a failure here is a
  # warning of what the next release breaks, not a failure of the change.
  next-rc:
    needs: kernels
    if: needs.kernels.outputs.rc != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      KERNEL_VERSION: ${{ needs.kernels.outputs.rc }}
    steps:
      - uses: actions/checkout@v6
      - name: Development image
        run: docker build -q -t mxlfs-dev dev
      - name: Kernel cache
        uses: actions/cache@v4
        with:
          path: build/linux-${{ env.KERNEL_VERSION }}
          key: kernel-${{ env.KERNEL_VERSION }}-${{ hashFiles('dev/kernel.sh', 'dev/kernel-src.sh', 'dev/Dockerfile') }}
      - name: Kernel
        run: ./dev/run.sh env KERNEL_VERSION="$KERNEL_VERSION" ./dev/kernel.sh
      - name: Module
        run: |
          ./dev/run.sh sh -c "make -C kernel KDIR=/src/build/linux-$KERNEL_VERSION W=1 C=1 2>&1 | tee /tmp/module.log;
            ! grep -E 'warning:|error:' /tmp/module.log"
