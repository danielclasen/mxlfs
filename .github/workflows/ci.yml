name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A new kernel release can break the build without a change here; the
  # daily run finds it, and builds and pushes the tree of a new stable
  # release or release candidate before a change needs it.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The kernels the build and the VM tests run on: dev/talos-kernel, the
  # kernel Talos ships, and the newest stable release from kernel.org; and
  # the mainline release candidate while one is open.
  kernels:
    runs-on: ubuntu-24.04
    outputs:
      rc: ${{ steps.k.outputs.rc }}
      matrix: ${{ steps.k.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: k
        run: |
          talos=$(cat dev/talos-kernel)
          curl -fsSL https://www.kernel.org/releases.json > releases.json
          stable=$(jq -r .latest_stable.version releases.json)
          rc=$(jq -r '.releases[] | select(.moniker == "mainline") | .version | select(test("-rc"))' releases.json)
          {
            echo "rc=$rc"
            echo "matrix=$(jq -cn --arg a "$talos" --arg b "$stable" '[$a, $b] | unique')"
          } >> "$GITHUB_OUTPUT"
          echo "talos $talos, stable $stable, rc ${rc:-none}"

  # The development image, pulled or built once and pushed for the jobs
  # below, which pull it. On a fork, whose token cannot push, this job does
  # nothing and each of them builds it again.
  dev-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUSH == 'true'
        run: ./dev/ci-images.sh dev

  checkpatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The token lifts the GitHub API's anonymous limit; a fork's pull
      # request gets a read-only one, which is all the fetch needs.
      - run: ./dev/checkpatch.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # The module, the harness and setcheck, built in the development image
  # against the kernel dev/kernel.sh builds for the VM tests, with KASAN
  # and lockdep, so a warning-free compile here is the one those tests run.
  # Kernel trees come from the registry (dev/kernel-cache.sh); a run that
  # had to build one pushes it there, unless it comes from a fork, whose
  # token cannot.
  build:
    needs: [kernels, dev-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.kernels.outputs.matrix) }}
    env:
      KERNEL_VERSION: ${{ matrix.kernel }}
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Development image
        env:
          PUSH: false
        run: ./dev/ci-images.sh dev

      - name: Kernel
        run: ./dev/ci-images.sh kernel

      - name: Module
        run: ./dev/run.sh ./dev/module.sh "/src/build/linux-$KERNEL_VERSION"

      - name: Harness
        run: ./dev/run.sh make -C tools CFLAGS="-O2 -g -Wall -Wextra -Werror -Wno-format-truncation"

      - name: setcheck
        if: strategy.job-index == 0
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell
          ./dev/run.sh sh -c 'cd tools/setcheck && test -z "$(gofmt -l .)" && go vet ./... && go test ./... && go build -o /tmp/setcheck .'

      - name: Keep the build for the VM tests
        run: tar -cf build.tar kernel/mxlfs.ko tools/harness

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.kernel }}
          path: build.tar
          retention-days: 3

  # The shell tests in a virtme-ng VM, on each kernel the build job built.
  # They wait for every build leg and run unless the workflow was cancelled,
  # so a failed build on one kernel does not skip the tests on the other;
  # that kernel's own legs fail at the missing build. The kernel tree is the
  # one the build job pushed, or, on a fork, built here again. The hosted
  # runners expose /dev/kvm, which only the runner user's group may open by
  # default.
  # rdma.sh and libmxl.sh run against dev/libmxl.sh's build of a
  # qvest-digital/mxl checkout, so neither runs here.
  vm-tests:
    needs: [kernels, dev-image, build]
    if: ${{ !cancelled() && needs.kernels.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.kernels.outputs.matrix) }}
        # Each line boots its own VM; a group runs them one after another
        # and fails if any failed.
        group:
          - name: redundancy
            tests: |
              FORMAT=video ./tests/redundancy.sh
              FORMAT=data ./tests/redundancy.sh
              FORMAT=audio ./tests/redundancy.sh
              FORMAT=video RATE=60000 RATE_DEN=1001 ./tests/redundancy.sh
              FORMAT=video WIDTH=3840 HEIGHT=2160 ./tests/redundancy.sh
              FORMAT=data RATE=30000 RATE_DEN=1001 ./tests/redundancy.sh
              FORMAT=audio SAMPLE_RATE=96000 CHANNELS=16 ./tests/redundancy.sh
          - name: replace-wait
            tests: |
              ./tests/wait.sh
              FORMAT=video ./tests/replace.sh
              FORMAT=data ./tests/replace.sh
              FORMAT=audio ./tests/replace.sh
              ./tests/placeholder.sh
          - name: files
            tests: |
              ./tests/views.sh
              ./tests/huge.sh
              ./tests/dentries.sh
          # A guest of two NUMA nodes, each half of dev/vm.sh's default 3G
          # and 4 CPUs: vng needs the nodes' memory to add up to VM_MEMORY.
          - name: numa
            vng: --numa 1536M,cpus=0-1 --numa 1536M,cpus=2-3
            tests: |
              ./tests/numa.sh
              ./tests/move.sh
    name: vm-tests (${{ matrix.kernel }}, ${{ matrix.group.name }})
    env:
      KERNEL_VERSION: ${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@v6

      - name: Open /dev/kvm to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Development image
        env:
          PUSH: false
        run: ./dev/ci-images.sh dev

      - name: Kernel
        run: ./dev/ci-images.sh kernel

      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.kernel }}

      - run: tar -xf build.tar

      - name: ${{ matrix.group.name }}
        env:
          TESTS: ${{ matrix.group.tests }}
          VNG: ${{ matrix.group.vng }}
        run: |
          failed=
          # The lines come in on fd 3: dev/run.sh runs docker with -i,
          # which would read the rest of stdin.
          while IFS= read -r t <&3; do
            [ -n "$t" ] || continue
            echo "::group::$t"
            if ./dev/run.sh env KERNEL_VERSION="$KERNEL_VERSION" VNG_OPTS="$VNG" ./dev/vm.sh "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::failed: $t"
              failed="$failed
          $t"
            fi
          done 3<<EOF
          $TESTS
          EOF
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  # The module against the kernel headers the distributions ship, with W=1.
  # sparse runs in the build job: the header packages leave out what kbuild
  # needs to run it.
  distro:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04
            setup: apt-get install -y -qq linux-headers-generic
          - name: debian-13-backports
            image: debian:trixie
            setup: >-
              echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list &&
              apt-get update -qq &&
              apt-get install -y -qq -t trixie-backports linux-headers-amd64
    name: distro (${{ matrix.name }})
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Headers
        env:
          DEBIAN_FRONTEND: noninteractive
          SETUP: ${{ matrix.setup }}
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential kmod
          sh -c "$SETUP"
      - name: Module
        run: |
          built=0
          for kdir in /usr/src/linux-headers-*; do
            [ -f "$kdir/Module.symvers" ] || continue
            echo "== $kdir"
            SPARSE=0 ./dev/module.sh "$kdir"
            built=$((built + 1))
          done
          [ "$built" -gt 0 ] || { echo "no kernel headers with Module.symvers" >&2; exit 1; }

  # 6.19, where compat.h first switches, 7.0, whose vm_area_desc helpers
  # distribution headers may carry from later releases, and 7.1, which no
  # other job pins; compiled only.
  between:
    needs: dev-image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kernel: ['6.19', '7.0', '7.1']
    permissions:
      contents: read
      packages: write
    env:
      KERNEL_VERSION: ${{ matrix.kernel }}
      FLAVOR: perf
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Development image
        env:
          PUSH: false
        run: ./dev/ci-images.sh dev
      - name: Kernel
        run: ./dev/ci-images.sh kernel
      - name: Module
        run: ./dev/run.sh ./dev/module.sh "/src/build/linux-$KERNEL_VERSION-perf"

  # The next kernel, while it is a release candidate: a failure here is a
  # warning of what the next release breaks, not a failure of the change.
  # Compile only, so the kernel is built without the debug options.
  next-rc:
    needs: [kernels, dev-image]
    if: needs.kernels.outputs.rc != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    env:
      KERNEL_VERSION: ${{ needs.kernels.outputs.rc }}
      FLAVOR: perf
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Development image
        env:
          PUSH: false
        run: ./dev/ci-images.sh dev
      - name: Kernel
        run: ./dev/ci-images.sh kernel
      - name: Module
        run: ./dev/run.sh ./dev/module.sh "/src/build/linux-$KERNEL_VERSION-perf"

  # The DKMS package: built and checked with lintian, then installed on
  # each distribution with one of its kernels, which DKMS builds the module
  # for, and that kernel booted under virtme-ng to load, mount and use it.
  # Debian 13 also gets its own 6.12 kernel, which DKMS must skip.
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and lintian
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie sh -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential dpkg-dev debhelper dh-dkms lintian >/dev/null &&
            ./dev/deb.sh &&
            su nobody -s /bin/sh -c "lintian --pedantic --fail-on warning,info,pedantic build/deb/*.deb"'
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/deb/*.deb
          retention-days: 3

  dkms:
    needs: deb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04
            setup: ''
            kernel: linux-image-generic linux-headers-generic
            apt: ''
            old: ''
          - name: debian-13-backports
            image: debian:trixie
            setup: echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
            kernel: linux-image-amd64 linux-headers-amd64
            apt: -t trixie-backports
            # trixie's own 6.12, which DKMS must skip.
            old: linux-image-amd64 linux-headers-amd64
    name: dkms (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: build/deb
      - name: Install, build and boot
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          KERNEL: ${{ matrix.kernel }}
          APT: ${{ matrix.apt }}
          OLD: ${{ matrix.old }}
        run: |
          docker run --rm --device /dev/kvm -v "$PWD:/src" -w /src \
            -e KERNEL_PACKAGES="$KERNEL" -e APT_OPTS="$APT" -e OLD_KERNEL_PACKAGES="$OLD" \
            -e SETUP="$SETUP" \
            "$IMAGE" sh -c 'sh -c "$SETUP" && ./dev/distro-test.sh'
